<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nights | Tehran Movement</title>
  <meta name="description" content="Tehran Movement nights from 2023 to 2026, with their line-ups and posters: All Night in Hell, 15 Oct 2026; Tehran Underground x Oscillator, 10 Sep 2026; All…">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tehran Movement">
  <meta property="og:title" content="Nights | Tehran Movement">
  <meta property="og:description" content="Tehran Movement nights from 2023 to 2026, with their line-ups and posters: All Night in Hell, 15 Oct 2026; Tehran Underground x Oscillator, 10 Sep 2026; All…">
  <meta property="og:url" content="https://tehranmovement.com/events/">
  <meta property="og:image" content="https://tehranmovement.com/assets/img/og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Tehran Movement, the name painted with a wide brush, yellow on black. Techno label and artist collective.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://tehranmovement.com/assets/img/og-card.png">

  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/tenor-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/tm-brush.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="assets/fonts/league-gothic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/room.css">
  <link rel="canonical" href="https://tehranmovement.com/events/">
</head>
<body>
  <a class="skip" href="#main">Skip to the content</a>

  <header class="top">
    <a class="top__mark" href="/" data-link aria-label="Tehran Movement, home"></a>
    <nav class="top__nav" aria-label="Sections">
      <a href="/mixes" data-link>Sessions</a>
      <a href="/artists" data-link>Crew</a>
      <a href="/events" data-link>Nights</a>
      <a href="/label" data-link>Label</a>
      <a href="/contact" data-link>Contact</a>
    </nav>
    <button class="top__menu" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
  </header>

  <!-- the whole site on one screen: the M of the logo walked, a page at every turn -->
  <div class="menu" id="menu" hidden>
    <canvas class="menu__fx" data-fx="zigzag" aria-hidden="true"></canvas>
    <button class="menu__close" type="button">Close</button>
    <nav class="menu__nav" aria-label="All pages"></nav>
  </div>

  <main id="main" tabindex="-1"></main>

  <!-- the pass of the brush between two pages (app.js, Wipe) -->
  <canvas class="wipe" aria-hidden="true" hidden></canvas>

  <!-- what is playing: it stays at the foot of the screen wherever you go. The sound comes from SoundCloud's own player, kept out of sight -->
  <div class="player" hidden data-state="idle">
    <div class="player__bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
    <div class="player__row">
      <button class="player__toggle" type="button" aria-label="Play">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16l14-8z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <p class="player__what"><b class="player__no"></b><span class="player__who"></span></p>
      <p class="player__time"><span class="player__now">0:00</span> / <span class="player__total"></span></p>
      <a class="player__ext" target="_blank" rel="noopener">SoundCloud</a>
      <button class="player__close" type="button" aria-label="Stop and close the player">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
      </button>
    </div>
    <p class="player__state" role="status"></p>
    <div class="player__sc" hidden><div class="player__frame"></div></div>
  </div>

  <noscript><p class="nojs">Tehran Movement is a techno label and artist collective from Tehran. This site needs JavaScript; the mixes are on SoundCloud and the news on Instagram.</p></noscript>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/extra.js"></script>
  <script src="assets/js/fx.js"></script>
  <script src="assets/js/room.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
